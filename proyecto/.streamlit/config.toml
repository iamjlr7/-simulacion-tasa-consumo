[theme]
base = "light"
primaryColor = "#3D4A54"
backgroundColor = "#F7F7F6"
secondaryBackgroundColor = "#EEEFEF"
textColor = "#1C1C1C"
font = "sans serif"

[client]
toolbarMode = "minimal"

[ui]
hideTopBar = true

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableXsrfProtection = true

[browser]
gatherUsageStats = false
